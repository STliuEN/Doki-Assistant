[project]
name = "backend"
version = "0.1.0"
description = "A FastAPI + LangChain project for LLM applications"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "RMA-MUN", email = "n3032747608@163.com" }
]
dependencies = [
    # Core config / serialization
    "python-dotenv~=1.2.2",
    "PyYAML~=6.0.3",
    "jsonschema~=4.26.0",
    "pydantic~=2.12.5",
    "pydantic-settings~=2.13.1",

    # Web API
    "fastapi~=0.123.0",
    "starlette~=0.50.0",
    "uvicorn>=0.31.1,<0.50.0",
    "python-multipart>=0.0.22",

    # Database / cache / auth
    "SQLAlchemy~=2.0.48",
    "aiomysql>=0.3.2",
    "redis>=7.3.0",
    "python-jose~=3.5.0",

    # HTTP clients
    "requests~=2.32.5",
    "httpx>=0.28.1",

    # Filesystem / upload helpers
    "aiofiles~=25.1.0",

    # LangChain / Agent / RAG
    "langchain>=1.2.13",
    "langchain-core~=1.2.17",
    "langchain-classic>=1.0.0",
    "langchain-community~=0.4.1",
    "langchain-text-splitters~=1.1.1",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.3",
    "langchain-dashscope>=0.1.8",
    "langgraph>=1.1.0",
    "langsmith>=0.7.22",
    "mcp>=1.9.0",
    "chromadb>=1.5.0",
    "rank-bm25>=0.2.2",

    # Model providers / local inference
    "dashscope>=1.25.14",
    "torch>=2.12.0",
    "sentence-transformers>=5.3.0",
    "transformers>=4.51.0",
    "accelerate>=1.13.0",
    "modelscope>=1.35.3",
    "tqdm>=4.67.0",

    # Document parsing
    "pypdf>=6.9.2",
    "unstructured[docx,md,pdf,pptx]>=0.22.20",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; sys_platform == 'win32' or sys_platform == 'darwin'",

    # PDF image extraction / multimodal page handling
    "pymupdf>=1.25.0",
    "pillow>=10.0.0",
    "imagehash>=4.3.0",
]

# 开发依赖
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "isort>=5.12.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[tool.uv]
environments = ["sys_platform == 'win32'"]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
cache-dir = ".uv-cache"
python-downloads = "never"
python-preference = "only-system"
