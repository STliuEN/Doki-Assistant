servers:
  - id: powershell_ls_test
    label: PowerShell LS Test
    description: Read-only MCP smoke test server that exposes a bounded project file listing tool.
    enabled: false
    transport: stdio
    command: python
    args:
      - mcp_servers/powershell_ls_server.py
    env: {}
    allow_tools:
      - list_project_files
    deny_tools: []
    default_risk_level: low
    default_requires_confirmation: false
    timeout_seconds: 10
    max_output_chars: 10000
  - id: public_info_lookup
    label: Public Info Lookup
    description: Read-only MCP server for Chinese university information and external ping checks.
    enabled: false
    transport: stdio
    command: python
    args:
      - mcp_servers/public_info_server.py
    env: {}
    allow_tools:
      - query_university_info
      - ping_check
    deny_tools: []
    default_risk_level: medium
    default_requires_confirmation: true
    timeout_seconds: 20
    max_output_chars: 10000
