        must_include: [benchmark]
        routing_contract: {exact_skill_ids: []}
        event_contract: {exactly_once: [done], terminal_type: done, require_done_session_id: true}
        state_contract: {created_messages: 1, updated_messages: 0}
        efficiency_contract: {max_tool_calls: 0}
        hard_vetoes: {forbidden_cross_user_access: true, forbidden_external_access: true}
        min_score: 0.95
      tags: [regression, context, no_external_network]
    rows:
      - {id: current_only, title: Current-only context, input: {context: {mode: current_only}}}
      - {id: recent, title: Recent context, input: {context: {mode: recent}}}
      - {id: all, title: All context, input: {context: {mode: all}}}
      - {id: null_context, title: Null context, input: {context: null}}
      - {id: auto_rag, title: Automatic RAG setting, input: {rag_retrieval: {mode: auto}}}
      - {id: null_rag, title: Null RAG setting, input: {rag_retrieval: null}}
      - {id: creative_prompt, title: Creative prompt with context, input: {prompt_type: chat_creative_prompt}}
      - {id: strict_prompt, title: Strict prompt with context, input: {prompt_type: chat_strict_prompt}}
      - {id: teacher_prompt, title: Teacher prompt with context, input: {prompt_type: chat_teacher_prompt}}
      - {id: cjk, title: CJK context query, input: {query: "结合当前上下文回答"}}
      - {id: english, title: English context query, input: {query: "answer with current context"}}
      - {id: multiline, title: Multiline context query, input: {query: "context line one\ncontext line two"}}
      - {id: no_tools, title: Context without tools, input: {skill_ids: [], tool_ids: []}}
      - {id: stable_repeat, title: Stable repeated context run}

  - id_prefix: error_recovery.boundary
    defaults:
      suite: error_recovery
      title: Tool error recovery boundary
      mode: offline
      input:
        query: recover after tool error
        prompt_type: main_prompt
        skill_ids: []
        tool_ids: []
        routed_skill_ids: []
